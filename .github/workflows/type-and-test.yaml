name: Roda Testes e Checa Tipos

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - uses: actions/checkout@v4

      - name: Setup do Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Instala Dependências
        run: npm ci

      - name: Roda Testes
        run: npm test

      - name: Checa Tipo
        run: npm run type-check
